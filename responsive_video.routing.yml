entity.responsive_video_style.collection:
  path: "/admin/structure/responsive-video-style"
  defaults:
    _entity_list: "responsive_video_style"
    _title: "Responsive Video Styles"
  requirements:
    _permission: "administer responsive_video_style"

entity.responsive_video_style.add_form:
  path: "/admin/structure/responsive-video-style/add"
  defaults:
    _entity_form: "responsive_video_style.add"
    _title: "Add Responsive Video Style"
  requirements:
    _permission: "administer responsive_video_style"

entity.responsive_video_style.edit_form:
  path: "/admin/structure/responsive-video-style/{responsive_video_style}"
  defaults:
    _entity_form: "responsive_video_style.edit"
    _title: "Edit Responsive Video Style"
  requirements:
    _permission: "administer responsive_video_style"

entity.responsive_video_style.delete_form:
  path: "/admin/structure/responsive-video-style/{responsive_video_style}/delete"
  defaults:
    _entity_form: "responsive_video_style.delete"
    _title: "Delete Responsive Video Style"
  requirements:
    _permission: "administer responsive_video_style"

entity.video_style.collection:
  path: "/admin/structure/video-style"
  defaults:
    _entity_list: "video_style"
    _title: "Video Styles"
  requirements:
    _permission: "administer video_style"

entity.video_style.add_form:
