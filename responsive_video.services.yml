services:
  responsive_video.event_subscriber:
    class: Drupal\responsive_video\EventSubscriber\ResponsiveVideoSubscriber
    arguments:
      - '@responsive_video.filesystem_manager'
      - '@responsive_video.converter'
    tags:
      - { name: event_subscriber }

  responsive_video.filesystem_manager:
    class: Drupal\responsive_video\FilesystemManager
    arguments: ['@file_system']

  responsive_video.style_format_mixer:
    class: Drupal\responsive_video\StyleFormatMixer
    arguments:
      - '@entity_type.manager'

  plugin.manager.responsive_video_converter_api_plugin:
    class: Drupal\responsive_video\ResponsiveVideoConverterApiPluginPluginManager
    parent: default_plugin_manager

  responsive_video.converter_plugin_manager:
    class: Drupal\responsive_video\ConverterPluginManager
    arguments:
      - '@config.factory'
      - '@plugin.manager.responsive_video_converter_api_plugin'

  responsive_video.converter:
    class: Drupal\responsive_video\VideoConverterService
    arguments:
    - '@responsive_video.filesystem_manager'
    - '@responsive_video.style_format_mixer'
    - '@responsive_video.converter_plugin_manager'

  logger.channel.responsive_video:
    parent: logger.channel_base
    arguments: [ 'responsive_video' ]
